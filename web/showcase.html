<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="微博展示">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/fake-weibo-180.png">
<title>微博通知 · 本地归档展示</title>
<link rel="stylesheet" href="css/showcase.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="statusbar" aria-hidden="true">
    <span class="sb-time" id="sbTime">--:--</span>
    <span class="sb-icons">
      <svg viewBox="0 0 17 11" width="17" height="11" fill="currentColor" aria-hidden="true">
        <rect x="0" y="7" width="3" height="4" rx="1"></rect>
        <rect x="4.6" y="5" width="3" height="6" rx="1"></rect>
        <rect x="9.2" y="2.6" width="3" height="8.4" rx="1"></rect>
        <rect x="13.8" y="0" width="3" height="11" rx="1"></rect>
      </svg>
      <svg viewBox="0 0 24 18" width="17" height="13" fill="currentColor" aria-hidden="true">
        <circle cx="12" cy="15" r="2"></circle>
        <path d="M12 9.6c2 0 3.8.8 5.2 2l-1.7 1.7A5.3 5.3 0 0 0 12 12a5.3 5.3 0 0 0-3.5 1.3L6.8 11.6c1.4-1.2 3.2-2 5.2-2Z"></path>
        <path d="M12 4.6c3.4 0 6.5 1.3 8.8 3.5l-1.7 1.7A10.3 10.3 0 0 0 12 7a10.3 10.3 0 0 0-7.1 2.8L3.2 8.1A12.3 12.3 0 0 1 12 4.6Z"></path>
      </svg>
      <svg viewBox="0 0 25 12" width="25" height="12" aria-hidden="true">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity="0.4"></rect>
        <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"></rect>
        <path d="M23 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" opacity="0.4"></path>
      </svg>
    </span>
  </div>

  <header class="navbar" id="navbar"></header>
  <main class="screen" id="screen" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>
  <div class="settings-root" id="settingsRoot"></div>
  <div class="thread-root" id="threadRoot"></div>
  <div class="image-viewer" id="imageViewer" hidden>
    <button class="image-viewer-close" type="button" data-image-close aria-label="关闭">×</button>
    <div class="image-viewer-stage" id="imageViewerStage">
      <img id="imageViewerImg" alt="">
    </div>
    <div class="image-viewer-hint">双指缩放 · 双击放大</div>
  </div>
  <div class="gate" id="gate" hidden>
    <div class="gate-inner">
      <img class="gate-logo" src="icons/fake-weibo-192.png" alt="">
      <h1 class="gate-title">WEIBO SIMULATOR</h1>
      <p class="gate-desc">请输入邀请码</p>
      <div class="gate-form">
        <input class="gate-input" id="gateInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="WX-XXXX-XXXX">
        <button class="gate-btn" id="gateBtn" type="button">进入</button>
      </div>
      <p class="gate-msg" id="gateMsg"></p>
      <p class="gate-hint">邀请码由管理员在后台生成</p>
    </div>
  </div>
  <div class="overlay-root" id="overlayRoot"></div>
  <button class="fs-btn" id="fsBtn" type="button" aria-label="全屏"></button>
  <div class="float-tip" id="floatTip" role="status" aria-live="polite"></div>
</div>
<script type="module" src="js/showcase.js"></script>
</body>
</html>
